# iNWEB Official — হিদায়াহ 🧪 Test (শুধু টেস্ট — বিল্ড নেই)
# রান: প্রতি push/PR-এ, অথবা হাত দিয়ে Actions → Test → Run workflow
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hidayah-test-${{ github.ref }}
  cancel-in-progress: true   # পুরোনো ব্রাঞ্চে রান ছেড়ে নতুনটাকে অগ্রাধিকার — মিনিট বাঁচে

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🤖 Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 📥 Ensure android-34 platform & build-tools 34.0.0 (SDK runner-এ প্রি-ইনস্টল)
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)
          yes | "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: 🛠️ Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: 🧪 Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: ⬆️ Test রিপোর্ট (শুধু ব্যর্থ হলে)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
