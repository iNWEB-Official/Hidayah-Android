# iNWEB Official — হিদায়াহ 🚀 Release Build (signed রিলিজ APK + GitHub Release-এ আপলোড)
# চলে: শুধু তখনই, যখন একটি `vX.Y.Z` tag push হয় (সাধারণত release-please-এর Release PR মার্জের ফলে)।
# ⚠️ পাবলিক রিলিজের আগে **নিষ্ক্রিয় (dormant)**:
#    (১) repo variable PUBLIC_RELEASE_ENABLED = 'true' — না হলে job পুরোটাই স্কিপ, এবং
#    (২) `environment: production` — Settings → Environments → production → Required reviewers
#        যাকে অ্যাপ্রুভার রাখবেন (স্বয়ং আপনি)। অ্যাপ্রুভাল ছাড়া রান শুরুই হবে না।
#
# পূর্বশর্ত (GitHub Secrets): HYD_KEYSTORE_B64, HYD_KEYSTORE_PASSWORD, HYD_KEY_ALIAS, HYD_KEY_PASSWORD

name: Release Build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Sign Release APK
    if: vars.PUBLIC_RELEASE_ENABLED == 'true'
    environment:
      name: production
      url: https://github.com/iNWEB-Official/Hidayah-Android/releases
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🤖 Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 📥 Ensure android-34 platform & build-tools 34.0.0
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)
          yes | "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: 🛠️ Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: 🔑 রিলিজ কীস্টোর (secrets থেকে ডিকোড)
        env:
          HYD_KEYSTORE_B64: ${{ secrets.HYD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$HYD_KEYSTORE_B64" ]; then
            echo "❌ HYD_KEYSTORE_B64 secret নেই — রিলিজ বিল্ড বাতিল।"
            exit 1
          fi
          DEST="$RUNNER_TEMP/hidayah-release.p12"
          echo "$HYD_KEYSTORE_B64" | base64 -d > "$DEST"
          chmod 600 "$DEST"
          echo "HYD_KEYSTORE_PATH=$DEST" >> "$GITHUB_ENV"

      - name: 📦 Release APK (R8/minify সহ)
        env:
          HYD_KEYSTORE_PASSWORD: ${{ secrets.HYD_KEYSTORE_PASSWORD }}
          HYD_KEY_ALIAS: ${{ secrets.HYD_KEY_ALIAS }}
          HYD_KEY_PASSWORD: ${{ secrets.HYD_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: 🖊️ স্বাক্ষর যাচাই (cert SHA-256 == হিদায়াহ রিলিজ কী)
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          EXPECTED="3ae87f2001011a59b255e111e5a4414cd98a2b511aa2ebe8d2ac4b7732d0ec62"
          grep -qi "$EXPECTED" /tmp/certs.txt \
            && echo "✅ স্বাক্ষর OK — হিদায়াহর রিলিজ কী (3AE8…EC62)" \
            || { echo "❌ স্বাক্ষর মিলছে না! ভুল কীস্টোর।"; exit 1; }

      - name: 🔎 badging যাচাই (versionName == tag)
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          "$AAPT" dump badging "$APK" | grep -q "versionName='${TAG_VERSION}'"
          echo "✅ badging OK: versionName='${TAG_VERSION}'"

      - name: ⬆️ GitHub Release-এ APK আপলোড (tag vX.Y.Z)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" app/build/outputs/apk/release/app-release.apk --clobber
          echo "✅ Release ${GITHUB_REF_NAME}-এ app-release.apk আপলোড হয়েছে।"
