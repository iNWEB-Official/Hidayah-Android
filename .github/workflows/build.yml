# iNWEB Official — হিদায়াহ 📦 Build (শুধু বিল্ড — টেস্ট নেই)
# রান: শুধু প্রয়োজন হলে হাত দিয়ে Actions → Build → Run workflow
# (টেস্ট চালাতে Test workflow-টি ব্যবহার করুন; দুটো একসাথে না চালিয়ে সময় বাঁচান)
name: Build

on:
  workflow_dispatch:
  # চাইলে পরে চালু করতে পারেন:
  # push:
  #   branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Sign
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🤖 Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 📥 Ensure android-34 platform & build-tools 34.0.0 (SDK runner-এ প্রি-ইনস্টল)
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)
          yes | "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: 🛠️ Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      # কীস্টোর কখনো রিপোতে নেই — GitHub Secrets থেকে base64-এ ডিকোড হয় (private repo: iNWEB-DOCS → secure/KEYSTORE.md)
      - name: 🔑 রিলিজ কীস্টোর (secrets থেকে ডিকোড)
        env:
          HYD_KEYSTORE_B64: ${{ secrets.HYD_KEYSTORE_B64 }}
        run: |
          if [ -n "$HYD_KEYSTORE_B64" ]; then
            DEST="$RUNNER_TEMP/hidayah-release.p12"
            echo "$HYD_KEYSTORE_B64" | base64 -d > "$DEST"
            chmod 600 "$DEST"
            echo "HYD_KEYSTORE_PATH=$DEST" >> "$GITHUB_ENV"
            echo "HYD_KEYSTORE_OK=true" >> "$GITHUB_ENV"
            echo "✅ কীস্টোর ডিকোড হয়েছে ($(stat -c%s "$DEST") bytes)"
          else
            echo "HYD_KEYSTORE_OK=false" >> "$GITHUB_ENV"
            echo "⚠️ HYD_KEYSTORE_B64 secret নেই — Release APK unsigned হবে"
          fi

      - name: 📦 Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: 📦 Release APK (signed — secrets থাকলে; R8/minify যাচাই)
        env:
          HYD_KEYSTORE_PASSWORD: ${{ secrets.HYD_KEYSTORE_PASSWORD }}
          HYD_KEY_ALIAS: ${{ secrets.HYD_KEY_ALIAS }}
          HYD_KEY_PASSWORD: ${{ secrets.HYD_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: 🖊️ Release স্বাক্ষর যাচাই (cert SHA-256 == docs/secure/KEYSTORE.md)
        if: env.HYD_KEYSTORE_OK == 'true'
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          EXPECTED="3ae87f2001011a59b255e111e5a4414cd98a2b511aa2ebe8d2ac4b7732d0ec62"
          grep -qi "$EXPECTED" /tmp/certs.txt \
            && echo "✅ স্বাক্ষর OK — হিদায়াহর রিলিজ কী (3AE8…EC62)" \
            || { echo "❌ স্বাক্ষর মিলছে না! ভুল কীস্টোর।"; exit 1; }

      - name: 🔎 Verify APK badging (versionName/versionCode)
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump badging "$APK" | grep -q "versionCode='20260007'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2026.00.07'"
          echo "✅ badging OK: versionCode=20260007 versionName=2026.00.07"

      - name: ⬆️ Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hidayah-apk-2026.00.07
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30
