# iNWEB Official — হিদায়াহ 📦 Debug Build (শুধু debug — টেস্ট নেই)
# রান: শুধু প্রয়োজন হলে হাত দিয়ে Actions → Debug Build → Run workflow
#
# ⚠️ নীতি (২০২৬-১৬-১১ থেকে): পাবলিক রিলিজ না হওয়া পর্যন্ত **কোনো রিলিজ ফাইল (signed release APK) তৈরি করা হবে না**।
# ব্যবহারকারী নিজে প্রতিটি পরিবর্তনের পর অ্যাপটি ব্যবহার করে দেখবেন — তার জন্য শুধু **debug APK** তৈরি হয়
# (debug keystore দিয়ে স্বাক্ষরিত, ফোনে সরাসরি ইনস্টল করা যায়)।
# প্রতিটি পরিবর্তনে versionName/versionCode +১ (দেখুন: app/build.gradle.kts, CHANGELOG.md)।
# টেস্ট চালাতে Test workflow-টি ব্যবহার করুন; দুটো একসাথে না চালিয়ে সময় বাঁচান।

name: Debug Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debug Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🤖 Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 📥 Ensure android-34 platform & build-tools 34.0.0 (SDK runner-এ প্রি-ইনস্টল)
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)
          yes | "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: 🛠️ Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: 📦 Debug APK (debug key দিয়ে — ইনস্টলযোগ্য)
        run: gradle :app:assembleDebug --no-daemon

      - name: 🔎 Verify APK badging (versionName/versionCode)
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump badging "$APK" | grep -q "versionCode='20260010'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2026.00.10'"
          echo "✅ badging OK: versionCode=20260010 versionName=2026.00.10"

      - name: ⬆️ Upload debug APK artifact (১৪ দিনের রিটেনশন)
        uses: actions/upload-artifact@v4
        with:
          name: hidayah-debug-2026.00.10
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
