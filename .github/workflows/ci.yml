# iNWEB Official — হিদায়াহ CI (test + build)
# সব টেস্ট ও বিল্ড GitHub-এ হয় — লোকালে বিল্ড/রান করা হয় না।
name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🤖 Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🛠️ Setup Android SDK (platform 34 + build-tools)
        uses: android-actions/setup-android@v3

      - name: 📥 Ensure android-34 platform & build-tools 34.0.0
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: 🛠️ Setup Gradle 8.4 (distribution in gradle/wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: 🧪 Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 📦 Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: 📦 Release APK (unsigned — R8/minify যাচাই)
        run: gradle :app:assembleRelease --no-daemon

      - name: 🔎 Verify APK badging (versionName/versionCode)
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "aapt: $AAPT"
          "$AAPT" dump badging "$APK" | grep -E "package: name='com.hidayah.android'" | sed 's/, /\n  /g'
          "$AAPT" dump badging "$APK" | grep -q "versionCode='20260006'"
          "$AAPT" dump badging "$APK" | grep -q "versionName='2026.00.06'"
          echo "✅ badging OK: versionCode=20260006 versionName=2026.00.06"

      - name: ⬆️ Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hidayah-apk-2026.00.06
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
